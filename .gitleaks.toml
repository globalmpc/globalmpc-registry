# Secret scan config — `.github/workflows/secrets.yml`
#
# Uses the default rules as is, allowing only published test values and vendored code.
# Before widening the allowlist, confirm the value really is public (a well-known default key).

[extend]
useDefault = true

[[allowlists]]
description = "Vendored external libraries — OpenZeppelin and forge-std's own test vectors"
paths = ['''(^|/)contracts/lib/''']

[[allowlists]]
description = "Local-only public defaults — deploy/local-secrets/README.md"
paths = ['''(^|/)deploy/local-secrets/''']

[[allowlists]]
description = "anvil default accounts #0 and #1 private keys — public values, no real assets"
regexes = [
  '''0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80''',
  '''0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d''',
]
