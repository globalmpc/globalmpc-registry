# Full local stack
#
# This file is **local and demo only**. Not for prod deployment — region and key ownership
# are undecided (OD-17·OD-18), and every credential here is a known value.
#
# Compose injects application credentials directly from environment variables. Defaults below
# are existing public local fixtures only; supply environment values to override them.

name: mpc-dapp

# Images are pinned as `tag@sha256:<index digest>`. A tag can be repointed; the digest cannot.
# Update both together — `docker buildx imagetools inspect <image>:<tag>` prints the multi-arch
# index digest.
#
# Every published port is bound to `127.0.0.1`. The credentials here are known values
# (`postgres/postgres`, `minioadmin`), so nothing may be reachable from another host.

services:
  postgres:
    image: &postgres_image postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mpc_dev
    # PostgreSQL may already be running on the host. Expose on a different port.
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible storage. Real deployments use managed S3, with the region set by OD-17.
  #
  # MinIO comes from Chainguard (`cgr.dev/chainguard`): the official `minio/*` images are no
  # longer pullable from Docker Hub or quay.io. Chainguard's free tier publishes **only
  # `latest`**, so the pin is `latest@sha256:<index digest>` and the digest is what fixes the
  # bytes. Refresh both MinIO images together, deliberately:
  #
  #   docker buildx imagetools inspect cgr.dev/chainguard/minio:latest
  #   docker buildx imagetools inspect cgr.dev/chainguard/minio-client:latest
  #
  # The image runs as non-root (uid 65532). A `miniodata` volume created by the earlier
  # root-run image is not writable by it, and MinIO then fails with "file access denied". Fix
  # only that volume in place — `down -v` would also delete `pgdata`. Running the `minio`
  # service itself mounts exactly this project's `miniodata` (pass the same `-p` you started
  # the stack with, if any), and the pinned image ships `chown`:
  #
  #   docker compose -f docker/docker-compose.yml stop minio
  #   docker compose -f docker/docker-compose.yml run --rm --no-deps -u 0 --entrypoint chown \
  #     minio -R 65532:65532 /data
  minio:
    image: cgr.dev/chainguard/minio:latest@sha256:a1d2b3516a41296510f7fb49184c18b88287fa8f35cf3ce5c047289053b94964
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${OBJECT_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${OBJECT_SECRET_ACCESS_KEY:-minioadmin}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes:
      - miniodata:/data
    healthcheck:
      # `local` is mc's built-in alias for http://localhost:9000; no shell is involved.
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Bucket creation. MinIO does not create buckets automatically. Dependents wait for this to
  # exit 0 (`service_completed_successfully`); `--ignore-existing` makes reruns succeed too.
  # The client image has no `/bin/sh`, so the alias comes from `MC_HOST_<alias>` and the config
  # directory is put on the writable `/tmp` (the image's home directory is not writable).
  # The credentials are shared with `minio`, api and scan-worker, so one override changes all
  # of them. MinIO requires a secret of at least 8 characters, and both values go into this
  # URL, so keep them URL-safe (no `@`, `:`, `/`, `%` or `#`).
  minio-init:
    image: cgr.dev/chainguard/minio-client:latest@sha256:778b2dac231584d5d5749ab663f9f61979d60dd5c00abf682af888db6a9f46e4
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MC_HOST_local: http://${OBJECT_ACCESS_KEY_ID:-minioadmin}:${OBJECT_SECRET_ACCESS_KEY:-minioadmin}@minio:9000
    command: ["--config-dir", "/tmp/mc", "mb", "--ignore-existing", "local/mpc-evidence"]

  # Observability — enable with `--profile observability`.
  #
  # Ports are published on loopback (`127.0.0.1`) only — not reachable from other hosts.
  # `/metrics` has no auth (instead it carries no identifying data), so the network forms the
  # boundary.
  prometheus:
    image: prom/prometheus:v3.1.0@sha256:6559acbd5d770b15bb3c954629ce190ac3cbbdb2b7f1c30f0385c4e05104e218
    profiles: ["observability"]
    volumes:
      - ../config/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../config/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  alertmanager:
    image: prom/alertmanager:v0.28.0@sha256:d5155cfac40a6d9250ffc97c19db2c5e190c7bc57c6b67125c94903358f8c7d8
    profiles: ["observability"]
    volumes:
      - ../config/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"

  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.8.5@sha256:32c8ea9ef052a440cb1620175987a3f49eff8b068a0c6a3d09ebf7f5f9a0e043
    # Match the chain id with the whole stack. Otherwise the chain_id the API records and the
    # chain the worker queries diverge, and transactions are never picked up.
    entrypoint: ["anvil", "--host", "0.0.0.0", "--port", "8545", "--chain-id", "31337", "--block-time", "1"]
    ports: ["127.0.0.1:8545:8545"]

  migrate:
    build: &build
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/mpc_dev
    working_dir: /repo/packages/db
    command: ["node", "--import", "tsx", "src/cli.ts"]

  # login role creation. The SQL lives in a file because `$$` in a compose command string
  # is substituted with the PID by the shell, breaking the PL/pgSQL block.
  login-roles:
    image: *postgres_image
    depends_on:
      migrate: { condition: service_completed_successfully }
    environment:
      PGPASSWORD: postgres
    volumes:
      - ../packages/db/sql:/sql:ro
    command: ["psql", "-h", "postgres", "-U", "postgres", "-d", "mpc_dev", "-v", "ON_ERROR_STOP=1", "-f", "/sql/login-roles.sql"]

  api:
    build: *build
    depends_on:
      postgres: { condition: service_healthy }
      login-roles: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
    environment:
      # Values are injected into the process environment; keep real credentials out of Git.
      DATABASE_URL: ${API_DATABASE_URL:-postgres://mpc_app_login:app@postgres:5432/mpc_dev}
      SESSION_SECRET: ${SESSION_SECRET:-local-development-session-secret-32chars}
      OBJECT_SECRET_ACCESS_KEY: ${OBJECT_SECRET_ACCESS_KEY:-minioadmin}
      PORT: "3001"
      SIWE_DOMAIN: localhost:3000
      SIWE_URI: http://localhost:3000
      CHAIN_ID: "31337"
      NODE_ENV: development
      OBJECT_STORE: s3
      OBJECT_BUCKET: mpc-evidence
      # Local MinIO has no notion of region. The real deployment's region is set by OD-17.
      OBJECT_REGION: us-east-1
      OBJECT_ENDPOINT: http://minio:9000
      # The browser cannot resolve the `minio` hostname. Signatures include the host, so the
      # public address must be used at signing time.
      OBJECT_PUBLIC_ENDPOINT: http://localhost:9000
      OBJECT_FORCE_PATH_STYLE: "true"
      # MinIO rejects SSE requests without KMS. Local only; in production loadConfig
      # blocks this value.
      OBJECT_SSE: none
      OBJECT_ACCESS_KEY_ID: ${OBJECT_ACCESS_KEY_ID:-minioadmin}
    ports: ["127.0.0.1:3001:3001"]
    working_dir: /repo/apps/api
    command: ["node", "--import", "tsx", "src/main.ts"]

  anchor-worker:
    image: mpc/anchor-worker:local
    build:
      context: ..
      dockerfile: docker/Dockerfile.workers
      args:
        WORKER: anchor-worker
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "const fs = require('node:fs'); try { process.exit(Date.now() - fs.statSync('/tmp/worker-heartbeat').mtimeMs < 90000 ? 0 : 1); } catch { process.exit(1); }"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      login-roles: { condition: service_completed_successfully }
      anvil: { condition: service_started }
    environment:
      WORKER_HEALTH_FILE: /tmp/worker-heartbeat
      # The worker spans multiple tenants, so it connects with a dedicated role (0012).
      DATABASE_URL: ${WORKER_DATABASE_URL:-postgres://mpc_worker_login:worker@postgres:5432/mpc_dev}
      ANCHOR_SIGNER_PRIVATE_KEY: ${ANCHOR_SIGNER_PRIVATE_KEY:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
      CHAIN_RPC_URL: http://anvil:8545
      CHAIN_ID: "31337"
      ANCHOR_CONTRACT_ADDRESS: "${ANCHOR_CONTRACT_ADDRESS:-0x5FbDB2315678afecb367f032d93F642f64180aa3}"
      ANCHOR_CONFIRMATIONS: "2"
      ANCHOR_POLL_MS: "2000"
      ANCHOR_RECHECK_MS: "5000"
      # Local anvil value only. anvil accounts hold no real assets. How to set the production
      # value is in `docs/operations/deployment.md`.
      ANCHOR_DAILY_SPEND_CAP_WEI: "1000000000000000000"
    command: ["node", "node_modules/tsx/dist/cli.mjs", "src/main.ts"]

  # Outbox publishing and notification webhook delivery. Without it, events and webhooks pile
  # up with no sign of why. With no notification sinks registered, delivery does nothing.
  jobs-worker:
    image: mpc/jobs-worker:local
    build:
      context: ..
      dockerfile: docker/Dockerfile.workers
      args:
        WORKER: jobs-worker
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "const fs = require('node:fs'); try { process.exit(Date.now() - fs.statSync('/tmp/worker-heartbeat').mtimeMs < 90000 ? 0 : 1); } catch { process.exit(1); }"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      login-roles: { condition: service_completed_successfully }
    environment:
      WORKER_HEALTH_FILE: /tmp/worker-heartbeat
      DATABASE_URL: ${WORKER_DATABASE_URL:-postgres://mpc_worker_login:worker@postgres:5432/mpc_dev}
      # Outbox event retries. At the cap the event is dead-lettered and shown on the audit
      # screen; `pnpm --filter @mpc/jobs-worker outbox:replay` puts it back (dry run by default).
      OUTBOX_MAX_ATTEMPTS: "5"
      # Delivery retries. At the cap a delivery stops — a dead receiver is not retried forever.
      NOTIFY_MAX_ATTEMPTS: "5"
      NOTIFY_BACKOFF_MS: "30000"
      NOTIFY_TIMEOUT_MS: "10000"
    command: ["node", "node_modules/tsx/dist/cli.mjs", "src/main.ts"]

  # No application code, credentials, or access to the application network.
  clamav:
    image: mpc/clamav:local
    build:
      context: ..
      dockerfile: docker/Dockerfile.clamav
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=256m,mode=1777"]
    volumes:
      - clamavdata:/var/lib/clamav
      - clamavscratch:/var/tmp/clamav
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [scan-internal, clamav-updates]
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 300s

  # Scan worker. Kept separate so infected file bytes never pass through the API process.
  scan-worker:
    image: mpc/scan-worker:local
    build:
      context: ..
      dockerfile: docker/Dockerfile.workers
      args:
        WORKER: scan-worker
    init: true
    restart: unless-stopped
    stop_grace_period: 480s
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,mode=1777"]
    networks: [default, scan-internal]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "const fs = require('node:fs'); try { process.exit(Date.now() - fs.statSync('/tmp/worker-heartbeat').mtimeMs < 90000 ? 0 : 1); } catch { process.exit(1); }"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      clamav: { condition: service_healthy }
      login-roles: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
      api: { condition: service_started }
    environment:
      WORKER_HEALTH_FILE: /tmp/worker-heartbeat
      DATABASE_URL: ${WORKER_DATABASE_URL:-postgres://mpc_worker_login:worker@postgres:5432/mpc_dev}
      OBJECT_SECRET_ACCESS_KEY: ${OBJECT_SECRET_ACCESS_KEY:-minioadmin}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      SCAN_POLL_MS: "3000"
      # Results are reported through the API. The worker takes the same SIWE path as a person.
      API_BASE_URL: http://api:3001
      SCAN_SERVICE_PRIVATE_KEY: ${SCAN_SERVICE_PRIVATE_KEY:-0x8b8b8b8b8b8b8b8b8b8b8b8b8b8b8b8b8b8b8b8b8b8b8b8b8b8b8b8b8b8b8b8b}
      CHAIN_ID: "31337"
      SIWE_DOMAIN: localhost:3000
      SIWE_URI: http://localhost:3000
      # Uses the **same storage settings** as the API. Otherwise the worker looks at a different
      # bucket and the scan backlog grows with no visible cause.
      OBJECT_STORE: s3
      OBJECT_BUCKET: mpc-evidence
      OBJECT_REGION: us-east-1
      OBJECT_ENDPOINT: http://minio:9000
      OBJECT_FORCE_PATH_STYLE: "true"
      OBJECT_SSE: none
      OBJECT_ACCESS_KEY_ID: ${OBJECT_ACCESS_KEY_ID:-minioadmin}
    command: ["node", "--import", "tsx", "src/main.ts"]

  web:
    build: *build
    depends_on:
      api: { condition: service_started }
    environment:
      PORT: "3000"
      NODE_ENV: production
      # Inside a container, localhost is the container itself. Call by service name.
      API_ORIGIN: http://api:3001
    ports: ["127.0.0.1:3000:3000"]
    working_dir: /repo/apps/web
    command: ["node", "node_modules/next/dist/bin/next", "start", "--port", "3000"]

volumes:
  pgdata:
  miniodata:
  clamavdata:
  clamavscratch:

# Only the scan worker can submit files. The scanner gets a separate network for
# signature downloads, with no other application services on that network.
networks:
  scan-internal:
    internal: true
  clamav-updates:
