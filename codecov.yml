# App and Solidity reports describe different scopes; keep their badges separate.
coverage:
  status:
    project:
      app:
        target: 90%
        flags:
          - app
    patch: off
parsers:
  lcov:
    # Match the CI line-coverage floor: an executed line counts as covered even
    # when some branches on that line were not taken. Keep branch data in LCOV.
    partials_as_hits: true
comment: false
flag_management:
  default_rules:
    carryforward: false
  individual_flags:
    - name: app
      paths:
        - apps/
        - packages/
    - name: contracts
      paths:
        - contracts/src/
fixes:
  # Forge reports paths relative to its contracts/ working directory.
  - 'src/::contracts/src/'
