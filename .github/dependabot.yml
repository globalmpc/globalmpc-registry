version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  # This npm runtime is installed independently from the pnpm workspace.
  - package-ecosystem: npm
    directory: /etc/otel
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      otel-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    ignore:
      # Node major upgrades follow the runtime policy, not automated image bumps.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
