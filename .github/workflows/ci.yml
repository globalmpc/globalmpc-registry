# Actions are **pinned to commit SHAs**.
#
# A tag like `@v4` is a movable reference. If the tag is repointed to another commit, different
# code runs while holding this repository's credentials. The trailing `# v4` is for human
# readers and plays no part in resolution.
#
# Update by changing the SHA — that way what changed stays in the diff.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck · tests · contracts
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mpc_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/mpc_test

      # Performance pass criteria.
      #
      # **The value is not hard-coded here.** No SLA figure has been decided, and putting in an
      # arbitrary number would turn it into a decision. It comes from a repository variable
      # (`vars.PERF_MAX_P95_MS`), so once a value is set the gate turns on **with no code change**.
      #
      # When empty, `throughput.test.ts` only measures and passes. It says so in its output, so
      # there is no state of "mistakenly believing the gauge is on".
      PERF_MAX_P95_MS: ${{ vars.PERF_MAX_P95_MS }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          # Same value as packageManager in package.json. If they differ, pnpm downloads that
          # version again itself and installs twice.
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

        name: Install
        run: pnpm install --frozen-lockfile

      # Do not ship dependencies with known vulnerabilities.
      #
      # Why `--prod`: only what goes into the deployment image is checked. Gating on advisories
      # for dev tooling would block deploys for reasons outside our control.
      # Only `high` and above block — a criterion with no ceiling ends up ignored.
      - name: Dependency vulnerability audit
        run: pnpm audit --prod --audit-level high

      # The list of checked projects lives in the references of `tsconfig.json`. Repeating it
      # here means adding a package updates only one side, and a missed package silently passes.
      # Web is not in those references — its check needs the types `next typegen` generates,
      # so the root script chains into `@mpc/web`'s own typecheck.
      - name: Typecheck
        run: pnpm typecheck

      # Web build. CSS and asset resolution failures such as a missing `design-system/dist`
      # do not surface in typecheck or tests; they only break in the deployment image build.
      - name: Web build
        run: pnpm --filter @mpc/web build

      # Without DATABASE_URL, DB tests are silently skipped. Tenant isolation and append-only
      # guarantees would pass unverified, so CI always sets it.
      - name: Unit and integration tests
        run: pnpm vitest run

      - name: Check DB tests were not skipped
        run: |
          output=$(pnpm vitest run --project @mpc/db --reporter=json 2>/dev/null || true)
          echo "$output" | grep -q '"numPendingTests":0' || {
            echo "DB tests were skipped. Check DATABASE_URL."
            exit 1
          }

      - name: OpenAPI drift
        run: |
          pnpm --filter @mpc/api-contract build
          git diff --exit-code -- packages/api-contract/openapi.json

      # R-04 banned terms only matter when applied to on-screen copy. Package tests check only
      # their own constants, so this step scans the actual UI copy and API messages.
      - name: R-04 banned terms
        run: pnpm check:copy

      # Logo copies in public/ silently keep serving old artwork when the original changes.
      - name: Brand asset sync
        run: pnpm check:brand

      # The README test counts drifted twice — commits that added tests did not update the
      # README. Human discipline did not prevent it, so it is a gate.
      - name: README test counts
        run: pnpm check:counts

      # The deploy platform once rejected `${` in a volume path and halted the whole deploy.
      # Local compose accepts it, so without this check CI stays green while only the deploy
      # breaks.
      - name: Compose volume paths
        run: pnpm check:compose

      # design-system is a runtime dependency the web app references via link. If it is not
      # checked here, a change that edits tokens without regenerating dist passes as is.
      - name: Design system checks
        working-directory: design-system
        run: |
          npm ci
          npm run check
          npm test

      # MVP E2E must pass without a DID method or ZK prover (AC-28).
      - name: Check no DID/ZK dependency
        run: |
          if pnpm ls -r --depth 0 --json 2>/dev/null | grep -Eiq '"(did-|@digitalbazaar|snarkjs|circomlib|@iden3)'; then
            echo "AC-28 violation: a DID or ZK library is among the dependencies"
            exit 1
          fi
          echo "No DID/ZK dependencies"

      - name: SBOM
        run: pnpm licenses list --json > licenses.json || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: licenses
          path: licenses.json
          if-no-files-found: ignore

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mpc_e2e
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]

    env:
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/mpc_e2e
      E2E_APP_DATABASE_URL: postgres://mpc_app_login:app@localhost:5432/mpc_e2e

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

        name: Install
        run: pnpm install --frozen-lockfile

      - name: Playwright browsers
        run: pnpm --filter @mpc/web exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm --filter @mpc/web test:e2e

  contracts:
    name: Smart contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          # **Pin the version** — the default `stable` fetches whatever is latest that day. A
          # tool change would break the test count comparison with no code change. When
          # upgrading, update this and the README count together.
          version: v1.7.1

        name: Build
        run: forge build --sizes

      - name: Tests (incl. fuzz and invariant)
        run: forge test -vv

      # check:counts counts `.t.sol` functions without foundry and compares them to README.
      # Whether that static count matches the actual run can only be checked here.
      - name: README Foundry count matches the run
        run: |
          actual=$(forge test --json | python3 -c 'import json,sys;print(sum(len(s["test_results"]) for s in json.load(sys.stdin).values()))')
          stated=$(grep -oE '[0-9]+ Foundry tests' ../README.md | grep -oE '[0-9]+')
          test "$actual" = "$stated" || {
            echo "README states $stated Foundry tests, the run has $actual. Fix README.md."
            exit 1
          }
          echo "Foundry count matches: $actual"

  image:
    name: Container image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Alert config is checked **with the official amtool**. It sits in this job because only
      # this job has Docker. If it does not run on the same image as the deploy, a different
      # amtool version would pass different things.
      - name: Alertmanager config
        run: ./scripts/ops/check-alertmanager.sh

      # Build only, no push. Finding a broken Dockerfile at deploy time is too late.
      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
