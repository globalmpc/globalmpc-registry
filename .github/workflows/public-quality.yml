name: Build and coverage

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build and coverage
    if: github.repository == 'globalmpc/globalmpc-registry'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mpc_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /var/lib/postgresql/data
        ports: ["5432"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.5
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Web build
        run: pnpm --filter @mpc/web build
      - name: Contract build
        working-directory: contracts
        run: forge build --sizes
      - name: Application tests and coverage
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/mpc_test
        run: pnpm test:coverage --reporter=default --reporter=json --outputFile=coverage/app/tests.json
      - name: Verify complete test execution
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('coverage/app/tests.json', 'utf8'));
          const dbSuites = report.testResults.filter((suite) => suite.name.includes('/packages/db/'));
          if (!report.success || report.numPendingTests !== 0 || dbSuites.length === 0 ||
              dbSuites.some((suite) => suite.status !== 'passed' || suite.assertionResults.length === 0)) {
            throw new Error('Coverage requires successful app and database tests without skipped tests');
          }
          JS
      - name: Contract coverage
        working-directory: contracts
        run: |
          mkdir -p ../coverage/contracts
          forge coverage --report lcov --report-file ../coverage/contracts/lcov.info --no-match-coverage '(^|/)(test|script|lib|node_modules)/'
      - name: Coverage reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports
          path: coverage/
          if-no-files-found: error
          retention-days: 14

  publish-coverage:
    name: Publish coverage
    needs: quality
    # Do not grant publishing credentials to pull-request code, including fork PRs.
    if: github.repository == 'globalmpc/globalmpc-registry' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-reports
          path: coverage
      - name: Upload app coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage/app/lcov.info
          flags: app
          disable_search: true
          fail_ci_if_error: true
      - name: Upload contract coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage/contracts/lcov.info
          flags: contracts
          disable_search: true
          fail_ci_if_error: true
