# 커밋에 들어간 비밀값을 막는다. 규칙·허용 목록은 `.gitleaks.toml`.
#
# 액션 대신 릴리스 바이너리를 **체크섬으로 고정해** 받는다. gitleaks-action은
# 조직 저장소에 라이선스 키를 요구한다.
#
# 올릴 때는 버전과 체크섬을 함께 바꾼다 — 체크섬은 릴리스의
# `gitleaks_<버전>_checksums.txt`의 `linux_x64` 행이다.
name: secrets

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: 비밀값 검사
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # 지운 파일에 남은 값도 본다. 마지막 커밋만 보면 넣었다 지운 키가 통과한다.
          fetch-depth: 0

      - name: gitleaks 설치
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: 이력 전체 검사
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1
