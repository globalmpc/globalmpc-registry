# Blocks secrets from entering commits. Rules and allowlist live in `.gitleaks.toml`.
#
# Instead of the action, the release binary is downloaded **pinned by checksum**. gitleaks-action
# requires a license key for organization repositories.
#
# When upgrading, change the version and checksum together — the checksum is the `linux_x64`
# line of the release's `gitleaks_<version>_checksums.txt`.
name: secrets

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Also scan values left in deleted files. Scanning only the last commit lets a key that was added then removed pass.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Scan full history
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1
