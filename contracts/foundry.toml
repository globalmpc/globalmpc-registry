[profile.default]
src = "src"
out = "out"
libs = ["lib"]
allow_paths = ["../node_modules"]
# Read-only, one file: the deploy-script test checks its development address list against the
# TypeScript one so the two refusals cannot drift apart.
fs_permissions = [{ access = "read", path = "../packages/config/src/dev-keys.ts" }]
test = "test"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
# Reproducible build — "compiler/dependency pinning" from the 08 §8.10 deployment gate.
bytecode_hash = "none"
cbor_metadata = false
remappings = [
  "@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 256
# 64 calls per run: shorter runs rarely built a supersede chain longer than two links, so the
# chain rules were barely exercised.
depth = 64
fail_on_revert = false

[rpc_endpoints]
bsc = "${BSC_RPC_URL}"
opbnb_testnet = "${OPBNB_TESTNET_RPC_URL}"
